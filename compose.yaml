services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seatsurge
      POSTGRES_USER: seatsurge
      POSTGRES_PASSWORD: seatsurge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    labels:
      org.springframework.boot.ignore: true

volumes:
  pgdata:
